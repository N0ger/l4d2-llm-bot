[project]
name = "l4d2-llm-proxy"
version = "0.1.0"
description = "HTTP proxy between the L4D2 LLM Bot SourceMod plugin and an LLM"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["l4d2_llm_proxy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
