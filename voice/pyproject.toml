[project]
name = "l4d2-voice"
version = "0.1.0"
description = "Voice commands for L4D2 survivor bots (Left 4 Bots 2 + ion's Vocalizer)"
requires-python = ">=3.11"
dependencies = [
    "vosk>=0.3.45",
    "sounddevice>=0.4.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["l4d2_voice*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
